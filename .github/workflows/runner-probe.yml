name: Runner probe

# Temporary diagnostic: which GitHub-hosted runner labels does this repository
# support? Deleted once the release workflow is known to schedule.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Report runner
        run: |
          echo "requested: ${{ matrix.os }}"
          echo "actual arch: $(uname -m)"
          echo "swiftc: $(command -v swiftc || echo missing)"
